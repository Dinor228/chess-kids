      <rect x="200" y="280" width="40" height="40" rx="6"/>
      <rect x="280" y="280" width="40" height="40" rx="6"/>
    </g>
    <!-- 白色兵棋子剪影（居中） -->
    <g transform="translate(160,80)">
      <circle cx="0" cy="20" r="26" fill="#ffffff" stroke="#5d4037" stroke-width="10"/>
      <path d="M -44 130 C -44 96 -20 78 0 58 C 20 78 44 96 44 130 Z" fill="#ffffff" stroke="#5d4037" stroke-width="10" stroke-linejoin="round"/>
    </g>
